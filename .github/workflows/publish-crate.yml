name: Publish Crate to crates.io

# Cutting a GitHub release publishes both halves of this plugin: the crate here
# and the npm package in publish-npm.yml. Everything is configured except the
# token, which is a repository secret named CARGO_REGISTRY_TOKEN.
on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  publish-crate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # cargo publish builds the packaged crate before it uploads it, and on
      # Linux that build is a Tauri build, which needs these.
      - name: Install what Tauri links against on Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            libdbus-1-dev \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable

      - name: Publish
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
